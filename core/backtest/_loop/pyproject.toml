# STANDALONE maturin subcrate — deliberately separate from the root pyproject.toml
# (protected zone). Wiring the build into the root package + the Rust CI is a
# convergence patch (see projects/08_backtest_risk_engine/CONVERGENCE.md).
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "backtest-loop"
version = "0.1.0"
description = "Rust kernel for phase 2 of the P08 backtest engine."
requires-python = ">=3.11"

[tool.maturin]
module-name = "backtest_loop"
