# STANDALONE maturin subcrate — deliberately separate from the root pyproject.toml
# (protected zone). Wiring the build into the root package + the Rust CI is an
# open gap, see docs/decisions/002-per-project-ci-testpaths-gap.md.
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "backtest-loop"
version = "0.1.0"
description = "Rust kernel for phase 2 of the P08 backtest engine."
requires-python = ">=3.12"

[tool.maturin]
module-name = "backtest_loop"
