[package]
name = "backtest_loop"
version = "0.1.0"
edition = "2021"
description = "Rust kernel for phase 2 of the P08 backtest engine (point-in-time PnL accumulation)."

[lib]
name = "backtest_loop"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
numpy = "0.23"
