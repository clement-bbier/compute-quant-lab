# STANDALONE maturin subcrate — distinct from the root pyproject.toml (protected zone).
# `maturin develop` from this folder installs the compiled module under
# `core.pricing._kernel` in the active venv, without touching the root hatchling build.
[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "spark-kernel"
version = "0.1.0"
requires-python = ">=3.11"
description = "Rust kernel for the digital spark spread (parity with the Python oracle)."

[tool.maturin]
module-name = "core.pricing._kernel"
