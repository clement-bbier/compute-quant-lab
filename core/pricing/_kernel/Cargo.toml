[package]
name = "spark_kernel"
version = "0.1.0"
edition = "2021"
description = "Vectorised digital spark spread kernel (pyo3) — parity with the Python oracle."

[lib]
name = "_kernel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }
numpy = "0.23"
