[project]
name = "compute-quant-lab"
version = "0.1.0"
description = "Quant research lab: compute as an asset class (digital spark spread)."
requires-python = ">=3.12"
dependencies = [
    # Major upper bounds on the numeric stack: a pandas or numpy 2.x -> 3.x
    # bump would silently break backtests (dtypes, alignment).
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "entsoe-py>=0.6",
    "gridstatus>=0.36",
    "gridstatusio>=0.5",
    "requests>=2.31",
    "mlflow>=2.12,<4",
    "streamlit>=1.34",
    "plotly>=5.20",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    # Runtime, not dev: infra/mcp-servers/gpu-price-server/server.py imports it
    # and .mcp.json launches it with a bare `python`.
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-requests>=2.31",
    "pre-commit>=3.7",
    "maturin>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "core/pricing/_kernel/target",
    "core/backtest/_loop/target",
    "projects/04_compute_index_curve/forward_engine/target",
]

[tool.mypy]
python_version = "3.12"

# Stub-less third-party / in-repo Rust extension modules only. pandas/requests are
# typed via pandas-stubs/types-requests (dev deps) instead of blanket
# ignore_missing_imports, so a real typo in a *typed* import still fails mypy.
[[tool.mypy.overrides]]
module = [
    "backtest_loop",
    "spark_kernel",
    "forward_engine",
    "gridstatusio",
    "plotly.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# A single process can't aggregate multiple project suites: each
# projects/*/tests does `from conftest import ...` (bare import) -> `conftest`
# module collision across projects. CI therefore runs each folder in isolation
# (see .github/workflows/ci.yml). Default testpaths = the P01 foundation.
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `dashboard_kit` is the presentation layer (design tokens + Plotly/Streamlit chrome).
# Packaged alongside `core` so the dashboards can import it; deliberately kept OUT of
# `core`, which stays the pure quant library with no styling concern.
packages = ["core", "dashboard_kit"]
