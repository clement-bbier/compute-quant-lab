[project]
name = "compute-quant-lab"
version = "0.1.0"
description = "Labo de recherche quant : le compute comme classe d'actifs (digital spark spread)."
requires-python = ">=3.11"
dependencies = [
    # Bornes hautes majeures sur le socle numérique : une bascule 2.x -> 3.x de
    # pandas ou numpy casserait les backtests en silence (dtypes, alignement).
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "entsoe-py>=0.6",
    "gridstatus>=0.36",
    "gridstatusio>=0.5",
    "requests>=2.31",
    "mlflow>=2.12,<4",
    "streamlit>=1.34",
    "plotly>=5.20",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    # Runtime, pas dev : infra/mcp-servers/gpu-price-server/server.py l'importe
    # et .mcp.json le lance avec un `python` nu.
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "maturin>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "core/pricing/_kernel/target",
    "core/backtest/_loop/target",
    "projects/04_compute_index_curve/forward_engine/target",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Un seul process ne peut pas agréger plusieurs suites projet : chaque
# projects/*/tests fait `from conftest import ...` (import nu) → collision de
# module `conftest` entre projets. La CI lance donc chaque dossier en isolation
# (voir .github/workflows/ci.yml). testpaths par défaut = la fondation P01.
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
