name: storage-alert

# Alerts before GitHub storage fills up (the repo accumulates the compute history
# in plain git under data/snapshots/, no LFS). Weekly: if the repo size exceeds the
# threshold, opens an issue -> GitHub emails you (issue notifications enabled by
# default). No secret required (GITHUB_TOKEN is enough).

on:
  schedule:
    - cron: "0 8 * * 1" # every Monday 08:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check-size:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      THRESHOLD_KB: "700000" # ~700 MB (alert BEFORE GitHub's ~1 GB soft limit)
    steps:
      - name: Measure repo size and alert if over threshold
        run: |
          size=$(gh api "repos/${{ github.repository }}" --jq .size)
          echo "Repo size: ${size} KB (threshold ${THRESHOLD_KB} KB)"
          if [ "$size" -lt "$THRESHOLD_KB" ]; then
            echo "Below threshold, nothing to do."
            exit 0
          fi
          # Dedup: don't reopen if an alert is already open.
          open=$(gh issue list --state open --json title \
            --jq '[.[] | select(.title | startswith("URGENT storage"))] | length')
          if [ "$open" -gt 0 ]; then
            echo "Alert already open, not duplicating."
            exit 0
          fi
          gh issue create \
            --title "URGENT GitHub storage: ${size} KB (threshold ${THRESHOLD_KB})" \
            --body "The repo has reached ${size} KB. Action: migrate data/snapshots/ to object storage (S3/R2) or compact the git history. See docs/storage-roadmap.md. (Auto alert from storage-alert.yml.)"
