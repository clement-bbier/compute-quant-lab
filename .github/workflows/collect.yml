name: collect-gpu-prices

# Hourly GPU price collection (Vast.ai + RunPod) on GitHub servers: runs with the
# PC off, free. Accumulates snapshots on the dedicated `data-snapshots` branch
# (the `main` branch stays clean).
#
# Prerequisite (user side, one time): add the 2 secrets under
# Settings -> Secrets and variables -> Actions:
#   VASTAI_API_KEY, RUNPOD_API_KEY

on:
  schedule:
    - cron: "17 * * * *" # ~ every hour at :17 UTC (GitHub may drift)
  workflow_dispatch: {} # can be triggered manually (Actions tab)

permissions:
  contents: write

concurrency:
  group: collect-gpu-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (data-snapshots branch = code + accumulated history)
        uses: actions/checkout@v4
        with:
          ref: data-snapshots
          fetch-depth: 1

      - name: Setup uv + Python
        # No explicit python-version: setup-uv auto-discovers .python-version
        # at the repo root — single source of truth for the Python version.
        uses: astral-sh/setup-uv@v3

      - name: Install deps
        run: uv sync

      - name: Collect GPU prices (7 venues, key-gated)
        env:
          VASTAI_API_KEY: ${{ secrets.VASTAI_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          PRIMEINTELLECT_API_KEY: ${{ secrets.PRIMEINTELLECT_API_KEY }}
          DATACRUNCH_CLIENT_ID: ${{ secrets.DATACRUNCH_CLIENT_ID }}
          DATACRUNCH_CLIENT_SECRET: ${{ secrets.DATACRUNCH_CLIENT_SECRET }}
          CUDO_API_KEY: ${{ secrets.CUDO_API_KEY }}
          HYPERSTACK_API_KEY: ${{ secrets.HYPERSTACK_API_KEY }}
          TENSORDOCK_API_KEY: ${{ secrets.TENSORDOCK_API_KEY }}
        run: uv run python -m infra.collectors.gpu_price_snapshot

      - name: Commit & push snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/snapshots
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: snapshot $(date -u +%FT%TZ) [skip ci]"
            git push origin HEAD:data-snapshots
          fi
