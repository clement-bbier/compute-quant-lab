name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel a still-running CI run for the same ref (branch/PR) once a new push
# supersedes it — avoids burning runners on commits nobody cares about anymore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target dirs (one per crate)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/pricing/_kernel/target
            core/backtest/_loop/target
            projects/04_compute_index_curve/forward_engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/pricing/_kernel/Cargo.lock', 'core/backtest/_loop/Cargo.lock', 'projects/04_compute_index_curve/forward_engine/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Same command a developer runs after `git clone` / `git pull` — CI proves
      # the exact sequence documented in the Makefile actually works, in order:
      # uv sync (which does NOT keep the Rust kernels, they're outside the
      # lockfile) THEN the maturin develop builds.
      - run: make sync

      - run: make lint
      - run: make test
      - run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
