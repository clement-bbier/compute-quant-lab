name: ci
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build des noyaux Rust (maturin develop)
        run: |
          uv run maturin develop -m core/pricing/_kernel/Cargo.toml
          uv run maturin develop -m core/backtest/_loop/Cargo.toml
          uv run maturin develop -m projects/04_compute_index_curve/forward_engine/Cargo.toml
      - run: uv run ruff check .
      - run: uv run mypy core
      - name: Tests (chaque module en isolation — conftest non partagé entre projets)
        run: |
          set -euo pipefail
          ran=0
          for d in tests \
                   core/backtest/tests \
                   core/features/tests \
                   core/ingestion/tests \
                   core/ingestion/energy/tests \
                   core/ingestion/providers/tests \
                   core/models/tests \
                   core/signals/tests \
                   core/storage/tests \
                   infra/collectors/tests \
                   infra/mcp-servers/*/tests \
                   projects/*/tests; do
            # Un glob sans correspondance reste littéral : on le saute au lieu
            # de le passer à pytest, qui échouerait sur un chemin inexistant.
            [ -d "$d" ] || continue
            echo "== pytest $d =="
            uv run pytest -q "$d"
            ran=$((ran + 1))
          done
          echo "== $ran suites exécutées =="
          # Garde-fou : si les globs cessent de matcher, la CI doit échouer
          # bruyamment plutôt que passer au vert sans avoir rien testé.
          [ "$ran" -ge 20 ] || { echo "Trop peu de suites ($ran < 20)" >&2; exit 1; }
